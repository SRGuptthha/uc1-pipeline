name: UC1 Supply Chain Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'pipeline-output/run_pipeline.py'
      - 'pipeline-output/policy.json'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: '0 2 * * 1'   # every Monday 02:00 UTC
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'GitHub repo URL to scan'
        required: false
        default: 'https://github.com/SRGuptha/uc1-security-demo'
      create_prs:
        description: 'Create remediation PRs? (requires DEMO_REPO_PAT secret)'
        required: false
        default: 'false'
        type: boolean

jobs:
  security-scan:
    name: Supply Chain Security Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout uc1-pipeline
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine scan target
        id: target
        run: |
          REPO="${{ github.event.inputs.target_repo || 'https://github.com/SRGuptha/uc1-security-demo' }}"
          echo "repo=$REPO" >> $GITHUB_OUTPUT

      - name: Seed demo repo manifest
        env:
          DEMO_REPO_PAT: ${{ secrets.DEMO_REPO_PAT }}
        run: |
          # Try to fetch pom.xml from the target repo first
          OWNER=$(echo "${{ steps.target.outputs.repo }}" | sed 's|https://github.com/||' | cut -d'/' -f1)
          REPO=$(echo  "${{ steps.target.outputs.repo }}" | sed 's|https://github.com/||' | cut -d'/' -f2)
          echo "Target: $OWNER/$REPO"

          FOUND=0
          for branch in main master develop; do
            HTTP=$(curl -sL -w "%{http_code}" -o pipeline-output/pom.xml \
              "https://raw.githubusercontent.com/$OWNER/$REPO/$branch/pom.xml")
            if [ "$HTTP" = "200" ]; then
              echo "✓ Fetched pom.xml from $branch ($(wc -c < pipeline-output/pom.xml) bytes)"
              FOUND=1; break
            fi
          done

          # If repo has no pom.xml yet, push it (requires DEMO_REPO_PAT secret)
          if [ "$FOUND" = "0" ] && [ -n "$DEMO_REPO_PAT" ]; then
            echo "pom.xml not found — seeding demo repo via setup_demo_repo.py..."
            python pipeline-output/setup_demo_repo.py "$DEMO_REPO_PAT"
            sleep 3
            # Now fetch the freshly committed pom.xml
            HTTP=$(curl -sL -w "%{http_code}" -o pipeline-output/pom.xml \
              "https://raw.githubusercontent.com/$OWNER/$REPO/main/pom.xml")
            [ "$HTTP" = "200" ] && FOUND=1 && echo "✓ Fetched pom.xml after seeding"
          fi

          # Last resort: write the known vulnerable pom.xml directly (no token needed)
          if [ "$FOUND" = "0" ]; then
            echo "Writing known vulnerable pom.xml directly..."
            python3 pipeline-output/setup_demo_repo.py --write-local pipeline-output/pom.xml 2>/dev/null || \
            cat > pipeline-output/pom.xml << 'POMEOF'
<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0"
         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
  <modelVersion>4.0.0</modelVersion>
  <groupId>com.srguptha</groupId>
  <artifactId>uc1-security-demo</artifactId>
  <version>1.0.0</version>
  <packaging>jar</packaging>
  <name>UC1 Security Demo App</name>
  <properties>
    <java.version>17</java.version>
    <spring-framework.version>5.3.20</spring-framework.version>
    <jackson.version>2.13.0</jackson.version>
  </properties>
  <dependencies>
    <dependency>
      <groupId>org.springframework</groupId>
      <artifactId>spring-core</artifactId>
      <version>${spring-framework.version}</version>
    </dependency>
    <dependency>
      <groupId>org.springframework</groupId>
      <artifactId>spring-webmvc</artifactId>
      <version>${spring-framework.version}</version>
    </dependency>
    <dependency>
      <groupId>org.apache.logging.log4j</groupId>
      <artifactId>log4j-core</artifactId>
      <version>2.14.1</version>
    </dependency>
    <dependency>
      <groupId>com.fasterxml.jackson.core</groupId>
      <artifactId>jackson-databind</artifactId>
      <version>${jackson.version}</version>
    </dependency>
    <dependency>
      <groupId>org.apache.commons</groupId>
      <artifactId>commons-text</artifactId>
      <version>1.9</version>
    </dependency>
    <dependency>
      <groupId>org.yaml</groupId>
      <artifactId>snakeyaml</artifactId>
      <version>1.30</version>
    </dependency>
    <dependency>
      <groupId>com.h2database</groupId>
      <artifactId>h2</artifactId>
      <version>2.1.210</version>
    </dependency>
  </dependencies>
</project>
POMEOF
            echo "✓ Wrote pom.xml locally ($(wc -c < pipeline-output/pom.xml) bytes)"
          fi

      - name: Run pipeline (dry-run)
        if: github.event.inputs.create_prs != 'true'
        run: |
          python pipeline-output/run_pipeline.py \
            "${{ steps.target.outputs.repo }}" \
            --out-dir pipeline-output \
            --scan-only

      - name: Run pipeline (live — creates PRs)
        if: github.event.inputs.create_prs == 'true'
        env:
          DEMO_REPO_PAT: ${{ secrets.DEMO_REPO_PAT }}
        run: |
          python pipeline-output/run_pipeline.py \
            "${{ steps.target.outputs.repo }}" \
            --out-dir pipeline-output \
            --token "$DEMO_REPO_PAT"

      - name: Print report summary
        if: always()
        run: |
          python3 << 'PYEOF'
          import json
          try:
              t = json.load(open('pipeline-output/audit-trail.json'))
              h = t.get('pipeline_health', {})
              c = t.get('cve_summary',     {})
              print("")
              print("  ══════════════════════════════════════════")
              print("   SECURITY SCAN SUMMARY")
              print("  ══════════════════════════════════════════")
              print(f"   Repo    : {t.get('repo_url','—')}")
              print(f"   Language: {t.get('language','—')} / {t.get('ecosystem','—')}")
              print(f"   Grade   : {h.get('grade','—')}  ({h.get('score','—')}/100)  {h.get('label','')}")
              print(f"   CVEs    : {c.get('total_cves',0)}  "
                    f"(Critical: {c.get('critical_count',0)}, High: {c.get('high_count',0)})")
              print("  ══════════════════════════════════════════")
              for f in t.get('key_findings', []):
                  print(f"   • {f}")
          except Exception as e:
              print(f'Could not read audit-trail.json: {e}')
          PYEOF

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-${{ github.run_number }}
          path: |
            pipeline-output/dependency-health-report.html
            pipeline-output/audit-trail.json
            pipeline-output/sbom-cyclonedx.json
            pipeline-output/dependency-check-report.json
            pipeline-output/policy-report.json
            pipeline-output/secret-scan-report.json
            pipeline-output/drift-report.json
          retention-days: 90

      - name: Policy gate — fail build on critical violations
        run: |
          python3 << 'PYEOF'
          import json, sys
          try:
              r = json.load(open('pipeline-output/policy-report.json'))
              fails = [v for v in r.get('violations', []) if v.get('action') == 'FAIL']
              if fails:
                  print(f'POLICY FAILED: {len(fails)} violation(s)')
                  for v in fails:
                      print(f"  [{v['policy_id']}] {v['detail']}")
                  sys.exit(1)
              print('POLICY PASSED')
          except FileNotFoundError:
              print('policy-report.json not found — skipping gate')
          PYEOF
