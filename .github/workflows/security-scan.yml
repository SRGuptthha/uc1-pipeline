name: UC1 Supply Chain Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'pipeline-output/run_pipeline.py'
      - 'pipeline-output/policy.json'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # every Monday 02:00 UTC
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'GitHub repo URL to scan'
        required: false
        default: 'https://github.com/SRGuptthha/testUC1'
      target_branch:
        description: 'Branch to scan (e.g. DEV, main, master)'
        required: false
        default: 'DEV'
      manifest_subdir:
        description: 'Subdirectory containing pom.xml / manifest (leave blank for repo root)'
        required: false
        default: 'python_files'
      create_prs:
        description: 'Create remediation PRs? (requires DEMO_REPO_PAT secret)'
        required: false
        default: false
        type: boolean

jobs:
  security-scan:
    name: Supply Chain Security Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout uc1-pipeline
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine scan target
        id: target
        run: |
          REPO="${{ github.event.inputs.target_repo || 'https://github.com/SRGuptthha/testUC1' }}"
          BRANCH="${{ github.event.inputs.target_branch || 'DEV' }}"
          SUBDIR="${{ github.event.inputs.manifest_subdir || 'Java files' }}"
          echo "repo=$REPO"       >> $GITHUB_OUTPUT
          echo "branch=$BRANCH"   >> $GITHUB_OUTPUT
          echo "subdir=$SUBDIR"   >> $GITHUB_OUTPUT

      - name: Fetch manifest from target repo
        run: |
          OWNER=$(echo "${{ steps.target.outputs.repo }}" | sed 's|https://github.com/||' | cut -d'/' -f1)
          REPO=$(echo  "${{ steps.target.outputs.repo }}" | sed 's|https://github.com/||' | cut -d'/' -f2)
          BRANCH="${{ steps.target.outputs.branch }}"
          SUBDIR="${{ steps.target.outputs.subdir }}"
          echo "Scanning: $OWNER/$REPO  branch=$BRANCH  subdir=${SUBDIR:-<root>}"

          # URL-encode spaces in subdir path
          SUBDIR_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$SUBDIR'))")

          # Build candidate paths: specified branch+subdir first, then root fallbacks
          declare -a CANDIDATES
          if [ -n "$SUBDIR" ]; then
            CANDIDATES+=("$BRANCH/$SUBDIR_ENC/pom.xml")
            CANDIDATES+=("$BRANCH/pom.xml")
          else
            CANDIDATES+=("$BRANCH/pom.xml")
          fi
          # Also try common default branches at root as last resort
          for fb in main master develop; do
            [ "$fb" != "$BRANCH" ] && CANDIDATES+=("$fb/pom.xml")
          done

          FOUND=0
          for PATH_SUFFIX in "${CANDIDATES[@]}"; do
            URL="https://raw.githubusercontent.com/$OWNER/$REPO/$PATH_SUFFIX"
            HTTP=$(curl -sL -w "%{http_code}" -o pipeline-output/pom.xml "$URL")
            if [ "$HTTP" = "200" ] && [ -s pipeline-output/pom.xml ]; then
              echo "Fetched pom.xml from $PATH_SUFFIX ($(wc -c < pipeline-output/pom.xml) bytes)"
              FOUND=1; break
            fi
          done

          if [ "$FOUND" = "0" ]; then
            echo "ERROR: Could not fetch pom.xml from any candidate path in $OWNER/$REPO"
            echo "Tried: ${CANDIDATES[*]}"
            exit 1
          fi

      - name: Run pipeline (dry-run)
        if: github.event.inputs.create_prs != 'true'
        run: |
          python pipeline-output/run_pipeline.py \
            "${{ steps.target.outputs.repo }}" \
            --out-dir pipeline-output \
            --scan-only

      - name: Run pipeline (live — creates PRs)
        if: github.event.inputs.create_prs == 'true'
        env:
          DEMO_REPO_PAT: ${{ secrets.DEMO_REPO_PAT }}
        run: |
          python pipeline-output/run_pipeline.py \
            "${{ steps.target.outputs.repo }}" \
            --out-dir pipeline-output \
            --token "$DEMO_REPO_PAT"

      - name: Print report summary
        if: always()
        run: |
          python3 << 'PYEOF'
          import json
          try:
              t = json.load(open('pipeline-output/audit-trail.json'))
              h = t.get('pipeline_health', {})
              c = t.get('cve_summary',     {})
              print("")
              print("  ══════════════════════════════════════════")
              print("   SECURITY SCAN SUMMARY")
              print("  ══════════════════════════════════════════")
              print(f"   Repo    : {t.get('repo_url','—')}")
              print(f"   Language: {t.get('language','—')} / {t.get('ecosystem','—')}")
              print(f"   Grade   : {h.get('grade','—')}  ({h.get('score','—')}/100)  {h.get('label','')}")
              print(f"   CVEs    : {c.get('total_cves',0)}  "
                    f"(Critical: {c.get('critical_count',0)}, High: {c.get('high_count',0)})")
              print("  ══════════════════════════════════════════")
              for f in t.get('key_findings', []):
                  print(f"   • {f}")
          except Exception as e:
              print(f'Could not read audit-trail.json: {e}')
          PYEOF

      - name: Post PR comment with scan summary
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, sys
          try:
              t = json.load(open('pipeline-output/audit-trail.json'))
              h = t.get('pipeline_health', {})
              c = t.get('cve_summary', {})
              grade = h.get('grade', '?')
              score = h.get('score', '?')
              label = h.get('label', '')
              total = c.get('total_cves', 0)
              crit  = c.get('critical_count', 0)
              high  = c.get('high_count', 0)
              grade_emoji = {'A': '🟢', 'B': '🟡', 'C': '🟠', 'D': '🔴', 'F': '🔴'}.get(grade, '⚪')
              findings = '\n'.join(f'- {f}' for f in t.get('key_findings', [])[:5])
              body = (
                  f"## {grade_emoji} UC1 Security Scan\n\n"
                  f"**Grade:** {grade} ({score}/100) {label}\n\n"
                  f"- **Repo:** {t.get('repo_url', 'n/a')}\n"
                  f"- **Language:** {t.get('language', 'n/a')} / {t.get('ecosystem', 'n/a')}\n"
                  f"- **CVEs found:** {total} (Critical: {crit}, High: {high})\n\n"
                  f"### Key Findings\n"
                  f"{findings or '_No findings._'}\n\n"
                  f"> Full HTML report is available as a workflow artifact.\n"
              )
              pr_num = os.environ.get('PR_NUMBER', '')
              if not pr_num:
                  sys.exit(0)
              repo = os.environ.get('GITHUB_REPOSITORY', '')
              subprocess.run(
                  ['gh', 'pr', 'comment', pr_num, '--repo', repo, '--body', body],
                  check=True)
          except Exception as e:
              print(f'Could not post PR comment: {e}')
          PYEOF
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-${{ github.run_number }}
          path: |
            pipeline-output/dependency-health-report.html
            pipeline-output/audit-trail.json
            pipeline-output/sbom-cyclonedx.json
            pipeline-output/dependency-check-report.json
            pipeline-output/policy-report.json
            pipeline-output/secret-scan-report.json
            pipeline-output/drift-report.json
          retention-days: 90

      - name: Policy gate — fail build on critical violations
        if: always()
        run: |
          python3 << 'PYEOF'
          import json, sys
          try:
              r = json.load(open('pipeline-output/policy-report.json'))
              fails = [v for v in r.get('violations', []) if v.get('action') == 'FAIL']
              if fails:
                  print(f'POLICY FAILED: {len(fails)} violation(s)')
                  for v in fails:
                      print(f"  [{v['policy_id']}] {v['detail']}")
                  sys.exit(1)
              print('POLICY PASSED')
          except FileNotFoundError:
              print('policy-report.json not found — skipping gate')
          PYEOF
